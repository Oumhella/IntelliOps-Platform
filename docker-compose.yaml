services:
  erp-db:
    image: postgres:15-alpine
    container_name: erp-postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=erp
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - erp-db-data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - erp-network

  # The standard Postgres init directory runs only for a brand-new volume.
  # This one-shot job also provisions databases added after a volume exists.
  database-init:
    image: postgres:15-alpine
    depends_on:
      erp-db:
        condition: service_healthy
    environment:
      - PGHOST=erp-db
      - PGDATABASE=erp
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - ./docker/ensure-databases.sql:/scripts/ensure-databases.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/scripts/ensure-databases.sql"]
    networks:
      - erp-network

  redis:
    image: redis:7.4-alpine
    container_name: erp-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - erp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - erp-network

    # --- INFRASTRUCTURE DE SÉCURITÉ & CONFIGURATION ---
  vault:
    image: hashicorp/vault:1.15.2
    container_name: erp-vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    networks:
      - erp-network
    volumes:
      - ./vault/config:/vault/config
      - ./vault/file:/vault/file
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://0.0.0.0:8200
    entrypoint: [ "vault", "server", "-config=/vault/config/vault-config.json" ]

  vault-init:
    image: hashicorp/vault:1.15.2
    container_name: erp-vault-init
    depends_on:
      - vault
    networks:
      - erp-network
    volumes:
      - ./vault/file:/vault/file
      - ./vault/init:/vault/init
    env_file:
      - .env # Injecte les secrets locaux de .env de manière sécurisée
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_UNKEY=${VAULT_LOCAL_UNKEY}
      - VAULT_ROOT_TOKEN=${VAULT_LOCAL_ROOT_TOKEN}
    entrypoint: [ "/bin/sh", "/vault/init/init-vault.sh" ]

  config-server:
    build:
      context: .
      dockerfile: ./config-server/Dockerfile
    container_name: erp-config-server
    ports:
      - "8888:8888"
    networks:
      - erp-network
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - ./vault/file:/vault/file
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=vault
      - SPRING_CLOUD_VAULT_HOST=vault
      - SPRING_CLOUD_VAULT_PORT=8200
      - SPRING_CLOUD_VAULT_SCHEME=http
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_HOST=vault
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_PORT=8200
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_SCHEME=http
      - SPRING_CLOUD_VAULT_AUTHENTICATION=APPROLE
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s
  # --- MICROSERVICES ARCHITECTURE ---
  discovery-server:
    build:
      context: .
      dockerfile: ./discovery-server/Dockerfile
    container_name: erp-discovery-server
    ports:
      - "8761:8761"
    environment:
      # A single-node Compose registry must evict dead containers promptly.
      # Eureka self-preservation is intended for multi-node production clusters
      # and otherwise keeps obsolete container IPs routable after a rebuild.
      - EUREKA_SERVER_ENABLE_SELF_PRESERVATION=false
      - EUREKA_SERVER_EVICTION_INTERVAL_TIMER_IN_MS=10000
    networks:
      - erp-network

  gateway-service:
    build:
      context: .
      dockerfile: ./gateway_service/Dockerfile
    container_name: erp-gateway-service
    ports:
      - "8080:8080"
    networks:
      - erp-network
    env_file:
      - .env
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: user_service
        SERVICE_PORT: 8081
    container_name: erp-user-service
    # Business APIs are reachable from the host only through gateway-service.
    expose:
      - "8081"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://erp-db:5432/erp_users
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=erp-kafka:29092
      - SPRING_DATA_REDIS_HOST=redis
      - JWT_EXPIRATION=900000
      - REFRESH_COOKIE_SECURE=false
    depends_on:
      erp-db:
        condition: service_started
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - erp-network

  lead-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: lead_service
        SERVICE_PORT: 8082
    expose:
      - "8082"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://erp-db:5432/erp_leads
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=erp-kafka:29092
    depends_on:
      erp-db:
        condition: service_started
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - erp-network

  abonnement-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: abonnement_service
        SERVICE_PORT: 8083
    container_name: erp-abonnement-service
    expose:
      - "8083"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://erp-db:5432/erp_abonnements
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=erp-kafka:29092
    depends_on:
      erp-db:
        condition: service_started
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - erp-network


  stock-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: stock_service
        SERVICE_PORT: 8084
    container_name: erp-stock-service
    expose:
      - "8084"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://erp-db:5432/erp_stocks
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=erp-kafka:29092
    depends_on:
      erp-db:
        condition: service_started
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - erp-network

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: mcp-server
        SERVICE_PORT: 8085
    container_name: erp-mcp-server
    # Internal only: clients reach its HTTP API through the secured gateway.
    expose:
      - "8085"
    env_file:
      - .env
    environment:
      # Tool invocations return through the gateway so its JWT filter injects
      # the user and enterprise identity before any downstream service call.
      - GATEWAY_URL=http://gateway-service:8080
      # Use the gateway address advertised to the MCP client when deployed
      # behind an ingress; leave it empty locally to use the incoming host.
      - MCP_PUBLIC_BASE_URL=${MCP_PUBLIC_BASE_URL:-}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      lead-service:
        condition: service_started
      stock-service:
        condition: service_started
    networks:
      - erp-network
    # Docker Desktop's embedded resolver can return transient EAI_AGAIN errors
    # to the JVM for external AI providers. Keep these overridable for private
    # or corporate DNS environments.
    dns:
      - ${DOCKER_DNS_PRIMARY:-8.8.8.8}
      - ${DOCKER_DNS_SECONDARY:-1.1.1.1}

  store-integration-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: store-integration-service
        SERVICE_PORT: 8090
    container_name: erp-store-integration-service
    # Provider traffic reaches this service only through the gateway. Store
    # credentials are loaded from Vault/config-server, never from this block.
    expose:
      - "8090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://erp-db:5432/erp_integrations
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - LEAD_SERVICE_URL=http://lead-service:8082
      - STOCK_SERVICE_URL=http://stock-service:8084
      - INTEGRATION_PUBLIC_BASE_URL=${INTEGRATION_PUBLIC_BASE_URL:-}
      - INTEGRATION_ORDER_CURRENCY=${INTEGRATION_ORDER_CURRENCY:-MAD}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost:4200}
      - SHOPIFY_SCOPES=${SHOPIFY_SCOPES:-read_orders,read_products}
      - SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-2026-07}
    depends_on:
      database-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      lead-service:
        condition: service_started
      stock-service:
        condition: service_started
    networks:
      - erp-network
    # Docker Desktop's embedded resolver can return transient EAI_AGAIN errors
    # to the JVM for external providers (*.myshopify.com, ngrok, etc.).
    dns:
      - ${DOCKER_DNS_PRIMARY:-8.8.8.8}
      - ${DOCKER_DNS_SECONDARY:-1.1.1.1}

  # ─────────────── MINIO SERVER ───────────────
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z # Ou tag récent
    container_name: erp-minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────── AUTO-CREATION BUCKET ───────────────
  createbuckets:
    image: minio/mc
    container_name: erp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb myminio/invoices-erp --ignore-existing;
      /usr/bin/mc anonymous set download myminio/invoices-erp;
      exit 0;
      "
    networks:
      - erp-network
  paiement-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: paiement_service
        SERVICE_PORT: 8086
    container_name: erp-paiement-service
    expose:
      - "8086"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://erp-db:5432/erp_paiement
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=erp-kafka:29092
    depends_on:
      erp-db:
        condition: service_started
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - erp-network

  delivery-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: delivery_service
        SERVICE_PORT: 8087
    container_name: erp-delivery-service
    expose:
      - "8087"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://erp-db:5432/erp_deliveries
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=erp-kafka:29092
    depends_on:
      erp-db:
        condition: service_started
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - erp-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: erp-kafka
    ports:
      - "9092:9092"
    environment:
      # Enable KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://erp-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Cluster ID generation for KRaft
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@erp-kafka:29093'
    networks:
      - erp-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: notification_service
        SERVICE_PORT: 8089
    container_name: erp-notification-service
    expose:
      - "8089"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://erp-db:5432/erp_notifications
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=erp-kafka:29092
    depends_on:
      erp-db:
        condition: service_started
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - erp-network

  frontend:
    build:
      context: ./frontend_service
      dockerfile: Dockerfile
    container_name: erp-frontend-service
    ports:
      - "4200:80"
    depends_on:
      - gateway-service
    networks:
      - erp-network
    restart: always

networks:
  erp-network:
    driver: bridge

volumes:
  erp-db-data:
  erp-redis-data:
  minio_data:
