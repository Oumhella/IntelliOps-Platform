spring.application.name=mcp-server-test

# Unit and slice tests must not depend on locally running infrastructure.
spring.cloud.config.enabled=false
eureka.client.enabled=false

# No external model provider is needed: controller tests supply a test AgentChat bean.
agent.llm.provider=none
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

mcp.approval.ttl-seconds=300
services.gateway.url=http://localhost:8080

# Required by the shared JWT filter when the full application context is loaded.
app.jwt.secret=test-only-jwt-signing-key-32-characters-minimum
