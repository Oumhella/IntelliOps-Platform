<section class="stripe-checkout" [attr.aria-label]="'payment.checkout' | t">
  <div class="stripe-heading">
    <div>
      <span>{{ "payment.secure" | t }}</span>
      <strong
        >{{ preparation.amount }}
        {{ preparation.currency.toUpperCase() }}</strong
      >
    </div>
    <span class="stripe-mark">{{ "payment.powered" | t }}</span>
  </div>
  @if (loading) {
    <p class="stripe-loading">{{ "payment.loadingFields" | t }}</p>
  }
  <div #paymentElement class="stripe-element"></div>
  @if (errorMessage) {
    <p class="stripe-error" role="alert">{{ errorMessage }}</p>
  }
  <p class="stripe-note">{{ "payment.privacy" | t }}</p>
  <button
    class="primary-button stripe-submit"
    type="button"
    [disabled]="loading || processing"
    (click)="submit()"
  >
    {{ (processing ? "payment.confirming" : "payment.pay") | t }}
  </button>
</section>
