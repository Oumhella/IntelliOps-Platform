<main class="view-page"><header class="view-heading"><div><p class="eyebrow"><span>Account</span><b>/</b> Profile</p><h1>Profile and company</h1><p>Manage personal identity and workspace business information.</p></div></header><div class="view-grid"><section class="surface-card side-card"><h2>Personal information</h2><form (ngSubmit)="saveProfile()"><div class="form-grid"><label class="form-field"><span>First name</span><input name="first" [(ngModel)]="profileForm.firstname"/></label><label class="form-field"><span>Last name</span><input name="last" [(ngModel)]="profileForm.lastname"/></label><label class="form-field form-field-full"><span>Email</span><input [value]="profile()?.email||sessionUser()?.email" disabled/></label><label class="form-field form-field-full"><span>Phone</span><input name="phone" [(ngModel)]="profileForm.phone"/></label></div><div class="form-actions"><button class="primary-button" [disabled]="busy">Save profile</button></div></form></section><section class="surface-card side-card"><h2>Change password</h2><form (ngSubmit)="changePassword()"><div class="form-grid"><label class="form-field form-field-full"><span>Current password</span><input name="current" type="password" [(ngModel)]="passwordForm.currentPassword"/></label><label class="form-field form-field-full"><span>New password</span><input name="new" type="password" minlength="8" [(ngModel)]="passwordForm.newPassword"/></label><label class="form-field form-field-full"><span>Confirm password</span><input name="confirm" type="password" [(ngModel)]="passwordForm.confirmPassword"/></label></div><div class="form-actions"><button class="primary-button" [disabled]="busy">Change password</button></div></form></section></div>
@if(sessionUser()?.role==='ROLE_ADMIN'){<section class="surface-card side-card"><h2>Company information</h2><p>Only administrators can update tenant-wide legal, contact, and localization settings.</p><form (ngSubmit)="saveCompany()"><div class="form-grid"><label class="form-field"><span>Trading name</span><input name="company" [(ngModel)]="companyForm.companyName" required/></label><label class="form-field"><span>Activity</span><input name="activity" [(ngModel)]="companyForm.activityType" required/></label><label class="form-field"><span>Legal name</span><input name="legalName" [(ngModel)]="companyForm.legalName"/></label><label class="form-field"><span>Registration / ICE</span><input name="legalId" [(ngModel)]="companyForm.legalIdentifier"/></label><label class="form-field"><span>Tax identifier</span><input name="taxId" [(ngModel)]="companyForm.taxIdentifier"/></label><label class="form-field"><span>Business email</span><input type="email" name="businessEmail" [(ngModel)]="companyForm.contactEmail"/></label><label class="form-field"><span>Business phone</span><input name="businessPhone" [(ngModel)]="companyForm.contactPhone"/></label><label class="form-field"><span>Website</span><input name="website" [(ngModel)]="companyForm.website"/></label><label class="form-field form-field-full"><span>Address</span><input name="address" [(ngModel)]="companyForm.addressLine1"/></label><label class="form-field form-field-full"><span>Address complement</span><input name="address2" [(ngModel)]="companyForm.addressLine2"/></label><label class="form-field"><span>City</span><input name="city" [(ngModel)]="companyForm.city"/></label><label class="form-field"><span>Postal code</span><input name="postal" [(ngModel)]="companyForm.postalCode"/></label><label class="form-field"><span>Country (ISO)</span><input name="country" maxlength="2" [(ngModel)]="companyForm.countryCode"/></label><label class="form-field"><span>Currency</span><input name="currency" maxlength="3" [(ngModel)]="companyForm.currencyCode"/></label><label class="form-field form-field-full"><span>Timezone</span><input name="timezone" [(ngModel)]="companyForm.timezone"/></label></div><div class="form-actions"><button class="primary-button" [disabled]="busy">Save company</button></div></form></section>}</main>
