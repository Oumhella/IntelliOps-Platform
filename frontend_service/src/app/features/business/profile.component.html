<main class="view-page"><header class="view-heading"><div><p class="eyebrow"><span>Account</span><b>/</b> Profile</p><h1>My profile</h1><p>Manage your contact information and account password.</p></div></header><div class="view-grid"><section class="surface-card side-card"><h2>Profile information</h2><p>These details identify you across the enterprise workspace.</p><form (ngSubmit)="saveProfile()"><div class="form-grid"><label class="form-field"><span>First name</span><input name="first" [(ngModel)]="profileForm.firstname"/></label><label class="form-field"><span>Last name</span><input name="last" [(ngModel)]="profileForm.lastname"/></label><label class="form-field form-field-full"><span>Email</span><input [value]="profile()?.email||sessionUser()?.email" disabled/><small class="form-help">Email changes are not supported by the backend.</small></label><label class="form-field form-field-full"><span>Phone</span><input name="phone" [(ngModel)]="profileForm.phone"/></label></div><div class="form-actions"><button class="primary-button" [disabled]="busy">Save profile</button></div></form></section><section class="surface-card side-card"><h2>Change password</h2><p>Confirm your current password before choosing a new one.</p><form (ngSubmit)="changePassword()"><div class="form-grid"><label class="form-field form-field-full"><span>Current password</span><input name="current" type="password" autocomplete="current-password" [(ngModel)]="passwordForm.currentPassword"/></label><label class="form-field form-field-full"><span>New password</span><input name="new" type="password" autocomplete="new-password" [(ngModel)]="passwordForm.newPassword"/></label><label class="form-field form-field-full"><span>Confirm new password</span><input name="confirm" type="password" autocomplete="new-password" [(ngModel)]="passwordForm.confirmPassword"/></label></div><div class="form-actions"><button class="primary-button" [disabled]="busy">Change password</button></div></form></section></div></main>
