<main class="register-page"><section class="register-card">
  <div class="public-localization"><app-language-switcher /></div>
  <a class="register-brand" routerLink="/"><span class="brand-mark"><img src="/logo.jfif" alt="" /></span><strong>IntelliOps</strong></a>
  <p class="eyebrow">{{ 'register.onboarding' | t }}</p><h1>{{ 'register.title' | t }}</h1><p class="register-intro">{{ 'register.intro' | t }}</p>
  @if(errorMessage){<div class="register-error" role="alert">{{errorMessage}}</div>}
  <form (ngSubmit)="submit()">
    <label class="form-field form-field-full plan-select"><span>{{ 'register.plan' | t }}</span><select name="plan" [(ngModel)]="planId" [disabled]="loadingPlans" required><option [ngValue]="null">{{ 'register.choosePlan' | t }}</option>@for(plan of plans();track plan.idPlan){<option [ngValue]="plan.idPlan">{{plan.nomPlan}} — {{plan.prix}} MAD / {{plan.duree.toLowerCase()}}</option>}</select>@if(selectedPlan();as plan){<small class="form-help">{{plan.description || ('register.defaultPlan'|t)}} · {{plan.limiteCommandesMois > 0 ? plan.limiteCommandesMois + ' ' + ('register.monthlyOrders'|t) : ('register.unlimitedOrders'|t)}}</small>}</label>
    <div class="form-grid">
      <label class="form-field"><span>{{ 'register.company' | t }}</span><input name="company" [(ngModel)]="form.companyName" required/></label><label class="form-field"><span>{{ 'register.activity' | t }}</span><input name="activity" [(ngModel)]="form.activityType" required/></label>
      <label class="form-field"><span>{{ 'profile.firstName' | t }}</span><input name="first" [(ngModel)]="form.firstname" required/></label><label class="form-field"><span>{{ 'profile.lastName' | t }}</span><input name="last" [(ngModel)]="form.lastname" required/></label>
      <label class="form-field"><span>{{ 'common.email' | t }}</span><input name="email" type="email" autocomplete="username" [(ngModel)]="form.email" required/></label><label class="form-field"><span>{{ 'common.phone' | t }}</span><input name="phone" [(ngModel)]="form.phone"/></label>
      <label class="form-field form-field-full"><span>{{ 'auth.password' | t }}</span><input name="password" type="password" minlength="8" autocomplete="new-password" [(ngModel)]="form.password" required/><small class="form-help">{{ 'register.passwordHint' | t }}</small></label>
    </div><button class="primary-button register-submit" [disabled]="submitting||loadingPlans||!planId">{{ (submitting?'register.creating':'register.continue') | t }}</button>
  </form><p class="register-login">{{ 'register.already' | t }} <a routerLink="/login">{{ 'auth.signInLink' | t }}</a> · <a routerLink="/">{{ 'register.backPlans' | t }}</a></p>
</section></main>
