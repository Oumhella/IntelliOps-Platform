<main class="register-page"><section class="register-card"><a class="register-brand" routerLink="/login"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M6 5.5h12v4H6zM6 14.5h5v4H6zM14 14.5h4v4h-4z"/></svg></span><strong>IntelliOps</strong></a><p class="eyebrow">Enterprise onboarding</p><h1>Create your workspace</h1><p class="register-intro">Register the enterprise administrator account. Team accounts are created later from Team & access.</p>@if(errorMessage){<div class="register-error" role="alert">{{errorMessage}}</div>}<form (ngSubmit)="submit()"><div class="form-grid"><label class="form-field"><span>Company name</span><input name="company" [(ngModel)]="form.companyName" required/></label><label class="form-field"><span>Activity type</span><input name="activity" [(ngModel)]="form.activityType" required/></label><label class="form-field"><span>First name</span><input name="first" [(ngModel)]="form.firstname" required/></label><label class="form-field"><span>Last name</span><input name="last" [(ngModel)]="form.lastname" required/></label><label class="form-field"><span>Email</span><input name="email" type="email" autocomplete="username" [(ngModel)]="form.email" required/></label><label class="form-field"><span>Phone</span><input name="phone" [(ngModel)]="form.phone"/></label><label class="form-field form-field-full"><span>Password</span><input name="password" type="password" autocomplete="new-password" [(ngModel)]="form.password" required/></label></div><button class="primary-button register-submit" [disabled]="submitting">{{submitting?'Creating workspace...':'Create enterprise workspace'}}</button></form><p class="register-login">Already registered? <a routerLink="/login">Sign in</a></p></section></main>
