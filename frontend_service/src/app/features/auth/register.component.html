<main class="register-page"><section class="register-card"><a class="register-brand" routerLink="/"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M6 5.5h12v4H6zM6 14.5h5v4H6zM14 14.5h4v4h-4z"/></svg></span><strong>IntelliOps</strong></a><p class="eyebrow">Enterprise onboarding</p><h1>Create your workspace</h1><p class="register-intro">Choose the operating plan first. After secure sign-in, paid plans proceed to Stripe and workspace access remains locked until confirmation.</p>
@if(errorMessage){<div class="register-error" role="alert">{{errorMessage}}</div>}
<form (ngSubmit)="submit()"><label class="form-field form-field-full plan-select"><span>Selected plan</span><select name="plan" [(ngModel)]="planId" [disabled]="loadingPlans" required><option [ngValue]="null">Choose a published plan</option>@for(plan of plans();track plan.idPlan){<option [ngValue]="plan.idPlan">{{plan.nomPlan}} — {{plan.prix}} MAD / {{plan.duree.toLowerCase()}}</option>}</select>@if(selectedPlan();as plan){<small class="form-help">{{plan.description || 'IntelliOps business workspace'}} · {{plan.limiteCommandesMois > 0 ? plan.limiteCommandesMois + ' monthly orders' : 'Unlimited monthly orders'}}</small>}</label><div class="form-grid"><label class="form-field"><span>Company name</span><input name="company" [(ngModel)]="form.companyName" required/></label><label class="form-field"><span>Activity type</span><input name="activity" [(ngModel)]="form.activityType" required/></label><label class="form-field"><span>First name</span><input name="first" [(ngModel)]="form.firstname" required/></label><label class="form-field"><span>Last name</span><input name="last" [(ngModel)]="form.lastname" required/></label><label class="form-field"><span>Email</span><input name="email" type="email" autocomplete="username" [(ngModel)]="form.email" required/></label><label class="form-field"><span>Phone</span><input name="phone" [(ngModel)]="form.phone"/></label><label class="form-field form-field-full"><span>Password</span><input name="password" type="password" minlength="8" autocomplete="new-password" [(ngModel)]="form.password" required/><small class="form-help">At least 8 characters.</small></label></div><button class="primary-button register-submit" [disabled]="submitting||loadingPlans||!planId">{{submitting?'Creating workspace...':'Create workspace and continue'}}</button></form><p class="register-login">Already registered? <a routerLink="/login">Sign in</a> · <a routerLink="/">Back to plans</a></p></section></main>
