<main class="login-page"><section class="login-brand-panel"><div class="login-brand"><strong>IntelliOps</strong></div><div class="login-message"><span class="platform-label">Account recovery</span><h1>Choose a new<br/>password.</h1><p>The reset token can be used only once.</p></div></section><section class="login-form-panel"><form class="login-form" (ngSubmit)="submit()"><p class="eyebrow">Password reset</p><h2>Create a new password</h2>@if(message){<div class="login-success">{{message}} <a routerLink="/login">Sign in</a></div>}@if(error){<div class="login-error">{{error}}</div>}<label><span>New password</span><input type="password" name="password" [(ngModel)]="password" minlength="8" required/></label><label><span>Confirm password</span><input type="password" name="confirm" [(ngModel)]="confirm" required/></label><button class="login-submit" [disabled]="busy||!!message">Reset password</button></form></section></main>
