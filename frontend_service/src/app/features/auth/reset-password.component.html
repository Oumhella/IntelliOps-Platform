<main class="login-page">
  <section class="login-brand-panel">
    <div class="login-brand"><span class="brand-mark" aria-hidden="true"><img src="/logo.jfif" alt="" /></span><strong>IntelliOps</strong></div>
    <div class="login-message"><span class="platform-label">{{ 'auth.recovery' | t }}</span><h1>{{ 'auth.choosePassword' | t }}</h1><p>{{ 'auth.tokenOnce' | t }}</p></div>
  </section>
  <section class="login-form-panel">
    <app-language-switcher />
    <form class="login-form" (ngSubmit)="submit()">
      <p class="eyebrow">{{ 'auth.passwordReset' | t }}</p><h2>{{ 'auth.createPassword' | t }}</h2>
      @if(message){<div class="login-success">{{message}} <a routerLink="/login">{{ 'auth.signInLink' | t }}</a></div>} @if(error){<div class="login-error">{{error}}</div>}
      <label><span>{{ 'profile.newPassword' | t }}</span><input type="password" name="password" [(ngModel)]="password" minlength="8" required/></label>
      <label><span>{{ 'profile.confirmPassword' | t }}</span><input type="password" name="confirm" [(ngModel)]="confirm" required/></label>
      <button class="login-submit" [disabled]="busy||!!message">{{ 'auth.resetPassword' | t }}</button>
    </form>
  </section>
</main>
