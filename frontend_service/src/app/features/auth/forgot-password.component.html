<main class="login-page">
  <section class="login-brand-panel">
    <div class="login-brand"><span class="brand-mark" aria-hidden="true"><img src="/logo.jfif" alt="" /></span><strong>IntelliOps</strong></div>
    <div class="login-message"><span class="platform-label">{{ 'auth.recovery' | t }}</span><h1>{{ 'auth.recoveryHero' | t }}</h1><p>{{ 'auth.recoveryHint' | t }}</p></div>
  </section>
  <section class="login-form-panel">
    <app-language-switcher />
    <form class="login-form" (ngSubmit)="submit()">
      <p class="eyebrow">{{ 'auth.recovery' | t }}</p><h2>{{ 'auth.forgot' | t }}</h2><p class="form-intro">{{ 'auth.forgotIntro' | t }}</p>
      @if(message){<div class="login-success">{{message}}</div>} @if(error){<div class="login-error">{{error}}</div>}
      <label><span>{{ 'auth.email' | t }}</span><input type="email" name="email" [(ngModel)]="email" required/></label>
      <button class="login-submit" [disabled]="busy">{{ 'auth.sendReset' | t }}</button>
      <p class="login-help"><a routerLink="/login">{{ 'auth.backSignIn' | t }}</a></p>
    </form>
  </section>
</main>
