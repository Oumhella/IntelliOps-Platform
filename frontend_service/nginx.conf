server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page Application routing: redirect all unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls directly to your API Gateway container
    location /api/ {
        # No URI suffix: preserve the complete incoming /api/v1/... path.
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Gzip compression for faster frontend loads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
