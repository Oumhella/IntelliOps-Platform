spring.application.name=store-integration-service
server.port=8090
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

spring.datasource.url=jdbc:postgresql://localhost:5432/erp_integrations
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

integration.public-base-url=${INTEGRATION_PUBLIC_BASE_URL:}
integration.frontend-return-url=${FRONTEND_PUBLIC_URL:http://localhost:4200}/app/integrations
integration.allow-private-store-hosts=${INTEGRATION_ALLOW_PRIVATE_HOSTS:false}
integration.service-token-ttl-seconds=120
integration.order-currency=${INTEGRATION_ORDER_CURRENCY:MAD}
integration.shopify.client-id=${SHOPIFY_CLIENT_ID:}
integration.shopify.client-secret=${SHOPIFY_CLIENT_SECRET:}
integration.shopify.scopes=${SHOPIFY_SCOPES:read_orders,read_products}
integration.shopify.api-version=${SHOPIFY_API_VERSION:2026-07}

services.lead.url=${LEAD_SERVICE_URL:http://localhost:8082}
services.stock.url=${STOCK_SERVICE_URL:http://localhost:8084}
services.http.connect-timeout=${INTERNAL_HTTP_CONNECT_TIMEOUT:5s}
services.http.read-timeout=${INTERNAL_HTTP_READ_TIMEOUT:30s}
services.http.max-attempts=${INTERNAL_HTTP_MAX_ATTEMPTS:3}
services.http.retry-backoff=${INTERNAL_HTTP_RETRY_BACKOFF:500ms}

spring.cloud.config.fail-fast=true
spring.cloud.config.retry.enabled=true
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=2000
spring.cloud.config.retry.max-interval=10000
spring.web.error.include-message=always
spring.mvc.problem-details.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
openapi.service.title=Store Integration Service API
openapi.service.description=Verified Shopify and WooCommerce connections, product mappings, and webhook ingestion.
openapi.service.version=1.0.0

logging.level.org.example.storeintegration=DEBUG
