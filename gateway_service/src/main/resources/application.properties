server.port=8080
spring.application.name=gateway-service

spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
jwt.secret=${JWT_SECRET}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# Activation de la découverte des routes via Eureka
spring.cloud.gateway.discovery.locator.enabled=false

# Définition des routes explicites pour l'API du user-service
spring.cloud.gateway.routes[0].id=user-service-route
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**

# Configuration du client Eureka de la Gateway
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# On applique la sécurité et le Circuit Breaker sur cette route !
spring.cloud.gateway.routes[0].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[1].args.name=userServiceCircuitBreaker
spring.cloud.gateway.routes[0].filters[1].args.fallbackUri=forward:/fallback/user-service

# Route pour abonnement-service
spring.cloud.gateway.routes[1].id=abonnement-service-route
spring.cloud.gateway.routes[1].uri=lb://ABONNEMENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/abonnements/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter

# Route pour plans
spring.cloud.gateway.routes[2].id=plans-route
spring.cloud.gateway.routes[2].uri=lb://ABONNEMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/plans/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter

# Route pour lead-service
spring.cloud.gateway.routes[3].id=lead-service-route
spring.cloud.gateway.routes[3].uri=lb://LEAD-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/leads/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[3].filters[1]=SubscriptionEntitlement

# Route pour commande-service
spring.cloud.gateway.routes[4].id=commande-route
spring.cloud.gateway.routes[4].uri=lb://LEAD-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/commandes/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[4].filters[1]=SubscriptionEntitlement
spring.cloud.gateway.routes[4].filters[2]=InternalOrderOperations

# Route pour stock-service
# 1. STOCK-SERVICE (Boutiques)
spring.cloud.gateway.routes[5].id=boutique-service-route
spring.cloud.gateway.routes[5].uri=lb://STOCK-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/boutiques/**
spring.cloud.gateway.routes[5].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[5].filters[1]=SubscriptionEntitlement

# 2. STOCK-SERVICE (Produits)
spring.cloud.gateway.routes[6].id=produit-service-route
spring.cloud.gateway.routes[6].uri=lb://STOCK-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/produits/**
spring.cloud.gateway.routes[6].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[6].filters[1]=SubscriptionEntitlement

# 3. STOCK-SERVICE (Inventaires)
spring.cloud.gateway.routes[7].id=inventaire-service-route
spring.cloud.gateway.routes[7].uri=lb://STOCK-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/inventaires/**
spring.cloud.gateway.routes[7].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[7].filters[1]=SubscriptionEntitlement
spring.cloud.gateway.routes[7].filters[2]=InternalStockOperations

# 4. MCP-SERVER (MCP-AGENT)
spring.cloud.gateway.routes[8].id=mcp-agent-api-route
spring.cloud.gateway.routes[8].uri=lb://MCP-SERVER
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/agent/**
spring.cloud.gateway.routes[8].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[8].filters[1]=SubscriptionEntitlement

# MCP transport. The MCP service stays internal; external MCP clients connect
# only through these gateway paths and therefore must present a JWT on both the
# SSE connection and every message request.
spring.cloud.gateway.routes[9].id=mcp-transport-route
spring.cloud.gateway.routes[9].uri=lb://MCP-SERVER
spring.cloud.gateway.routes[9].predicates[0]=Path=/sse,/mcp/message/**
spring.cloud.gateway.routes[9].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[9].filters[1]=SubscriptionEntitlement

# 5.PAIMENT-SERVICE (Paiment)
spring.cloud.gateway.routes[10].id=paiement-service-route
spring.cloud.gateway.routes[10].uri=lb://PAIEMENT-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.routes[10].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[10].filters[1]=SubscriptionEntitlement
spring.cloud.gateway.routes[10].filters[2]=InternalPaymentOperations

#6. DELIVERY-SERVICE (Livraison)
spring.cloud.gateway.routes[11].id=delivery-service-route
spring.cloud.gateway.routes[11].uri=lb://DELIVERY-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/v1/livraisons/**
spring.cloud.gateway.routes[11].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[11].filters[1]=SubscriptionEntitlement

#7. NOTIFICATION-SERVICE (Notifications)
spring.cloud.gateway.routes[12].id=notification-service-route
spring.cloud.gateway.routes[12].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[12].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[12].filters[1]=SubscriptionEntitlement

# Platform-wide administration API (ROLE_SUPER_ADMIN is enforced by user-service)
spring.cloud.gateway.routes[13].id=platform-admin-route
spring.cloud.gateway.routes[13].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/v1/platform/**
spring.cloud.gateway.routes[13].filters[0]=JwtAuthenticationFilter

# Explicit service-document routes used by the central Swagger UI and MCP
# OpenAPI catalogue. StripPrefix removes the public service alias before the
# request reaches Springdoc in the target service.
spring.cloud.gateway.routes[14].id=user-service-docs
spring.cloud.gateway.routes[14].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[14].predicates[0]=Path=/user-service/v3/api-docs/**
spring.cloud.gateway.routes[14].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[14].filters[1]=StripPrefix=1

spring.cloud.gateway.routes[15].id=stock-service-docs
spring.cloud.gateway.routes[15].uri=lb://STOCK-SERVICE
spring.cloud.gateway.routes[15].predicates[0]=Path=/stock-service/v3/api-docs/**
spring.cloud.gateway.routes[15].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[15].filters[1]=StripPrefix=1

spring.cloud.gateway.routes[16].id=lead-service-docs
spring.cloud.gateway.routes[16].uri=lb://LEAD-SERVICE
spring.cloud.gateway.routes[16].predicates[0]=Path=/lead-service/v3/api-docs/**
spring.cloud.gateway.routes[16].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[16].filters[1]=StripPrefix=1

spring.cloud.gateway.routes[17].id=abonnement-service-docs
spring.cloud.gateway.routes[17].uri=lb://ABONNEMENT-SERVICE
spring.cloud.gateway.routes[17].predicates[0]=Path=/abonnement-service/v3/api-docs/**
spring.cloud.gateway.routes[17].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[17].filters[1]=StripPrefix=1

spring.cloud.gateway.routes[18].id=paiement-service-docs
spring.cloud.gateway.routes[18].uri=lb://PAIEMENT-SERVICE
spring.cloud.gateway.routes[18].predicates[0]=Path=/paiement-service/v3/api-docs/**
spring.cloud.gateway.routes[18].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[18].filters[1]=StripPrefix=1

spring.cloud.gateway.routes[19].id=delivery-service-docs
spring.cloud.gateway.routes[19].uri=lb://DELIVERY-SERVICE
spring.cloud.gateway.routes[19].predicates[0]=Path=/delivery-service/v3/api-docs/**
spring.cloud.gateway.routes[19].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[19].filters[1]=StripPrefix=1

spring.cloud.gateway.routes[20].id=notification-service-docs
spring.cloud.gateway.routes[20].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[20].predicates[0]=Path=/notification-service/v3/api-docs/**
spring.cloud.gateway.routes[20].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[20].filters[1]=StripPrefix=1

spring.cloud.gateway.routes[21].id=mcp-server-docs
spring.cloud.gateway.routes[21].uri=lb://MCP-SERVER
spring.cloud.gateway.routes[21].predicates[0]=Path=/mcp-server/v3/api-docs/**
spring.cloud.gateway.routes[21].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[21].filters[1]=StripPrefix=1

# Public provider callbacks. The integration service verifies OAuth state and
# provider HMAC signatures; these routes cannot require an end-user JWT.
spring.cloud.gateway.routes[22].id=store-integration-public-callbacks
spring.cloud.gateway.routes[22].uri=lb://STORE-INTEGRATION-SERVICE
spring.cloud.gateway.routes[22].predicates[0]=Path=/api/v1/integrations/oauth/shopify/callback,/api/v1/integrations/oauth/woocommerce/callback,/api/v1/integrations/webhooks/**
spring.cloud.gateway.routes[22].filters[0]=JwtAuthenticationFilter

# Tenant administration and product mappings remain authenticated and entitled.
spring.cloud.gateway.routes[23].id=store-integration-service-route
spring.cloud.gateway.routes[23].uri=lb://STORE-INTEGRATION-SERVICE
spring.cloud.gateway.routes[23].predicates[0]=Path=/api/v1/integrations/**
spring.cloud.gateway.routes[23].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[23].filters[1]=SubscriptionEntitlement

spring.cloud.gateway.routes[24].id=store-integration-service-docs
spring.cloud.gateway.routes[24].uri=lb://STORE-INTEGRATION-SERVICE
spring.cloud.gateway.routes[24].predicates[0]=Path=/store-integration-service/v3/api-docs/**
spring.cloud.gateway.routes[24].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[24].filters[1]=StripPrefix=1

# Kubernetes-native analytics service (does not register with Eureka).
spring.cloud.gateway.routes[25].id=analytics-service-route
spring.cloud.gateway.routes[25].uri=${ANALYTICS_SERVICE_URI:http://analytics-service:8091}
spring.cloud.gateway.routes[25].predicates[0]=Path=/api/v1/analytics/**
spring.cloud.gateway.routes[25].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[25].filters[1]=SubscriptionEntitlement

# CONFIG SERVER
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.enabled=true
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=2000
spring.cloud.config.retry.max-interval=10000

# --- Configuration Resilience4J ---
# Si un appel prend plus de 2 secondes (2000ms), le circuit breaker coupe l'appel et bascule sur le fallback
resilience4j.timelimiter.instances.userServiceCircuitBreaker.timeout-duration=2s

# =========================================================
# CONFIGURATION SWAGGER UI CENTRALISÉE
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html

# Menu déroulant (Select API) dans Swagger UI
springdoc.swagger-ui.urls[0].name=1. User Service
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=2. Stock Service
springdoc.swagger-ui.urls[1].url=/stock-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=3. Lead Service
springdoc.swagger-ui.urls[2].url=/lead-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=4. Abonnement Service
springdoc.swagger-ui.urls[3].url=/abonnement-service/v3/api-docs

springdoc.swagger-ui.urls[4].name=5. Paiement service
springdoc.swagger-ui.urls[4].url=/paiement-service/v3/api-docs

springdoc.swagger-ui.urls[5].name=6. MCP Server
springdoc.swagger-ui.urls[5].url=/mcp-server/v3/api-docs

springdoc.swagger-ui.urls[6].name=7. Delivery service
springdoc.swagger-ui.urls[6].url=/delivery-service/v3/api-docs

springdoc.swagger-ui.urls[7].name=8. Notification service
springdoc.swagger-ui.urls[7].url=/notification-service/v3/api-docs

springdoc.swagger-ui.urls[8].name=9. Store integration service
springdoc.swagger-ui.urls[8].url=/store-integration-service/v3/api-docs
