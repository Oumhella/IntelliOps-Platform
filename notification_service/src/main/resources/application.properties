spring.application.name=notification-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

server.port=8089

# ── Base de données PostgreSQL ──
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_notifications
spring.datasource.driver-class-name=org.postgresql.Driver
# username/password intentionally NOT declared here - supplied entirely by Vault
# via spring.config.import above. If Vault is unreachable, startup correctly fails
# instead of silently falling back to a guessed value.

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.expiration=${JWT_EXPIRATION:86400000}
# app.jwt.secret intentionally NOT declared here - supplied by Vault

# ── Error Handling ──
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=on_param
spring.mvc.problem-details.enabled=true

# ── Config Server (retry on startup) ──
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.enabled=true
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=2000
spring.cloud.config.retry.max-interval=10000

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── Kafka Configuration Defaults ──
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Topic Definition
app.kafka.topic.notifications=notifications-topic

# Enable explicit JavaMail SMTP debugging in logs
spring.mail.properties.mail.debug=true

# Add timeouts so it doesn't hang forever if connection fails
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#---------------------Open API-----------------
openapi.service.title=notification Service API
openapi.service.description=Gestion des notifications et le suivi des messages et communications internes et externes et interne services
openapi.service.version=1.0.
