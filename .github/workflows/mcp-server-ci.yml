name: MCP Server CI (DevSecOps)

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - 'mcp-server/**'
      - 'common_lib/**'
      - 'Dockerfile.microservice'
      - 'docker-compose.yaml'
      - '.github/workflows/mcp-server-ci.yml'
      - '.github/actions/build-and-scan-service/**'
      - '.github/workflows/update-gitops-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'common_lib/**'
      - 'Dockerfile.microservice'
      - 'docker-compose.yaml'
      - '.github/workflows/mcp-server-ci.yml'
      - '.github/actions/build-and-scan-service/**'
      - '.github/workflows/update-gitops-image.yml'

permissions:
  contents: read

jobs:
  build-test-and-scan:
    name: Build, test and scan MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reuse the shared pipeline, but opt into tests and blocking scans because
      # the MCP confirmation boundary is a safety-critical service contract.
      - name: Build, test and scan MCP server
        uses: ./.github/actions/build-and-scan-service
        with:
          service_name: mcp-server
          service_port: 8085
          image_name: erp-mcp-server
          build_common_lib: 'false'
          run_tests: 'true'
          fail_on_vulnerabilities: 'true'
          push_image: ${{ github.event_name == 'push' }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  update-gitops:
    name: Promote MCP server image to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/GitOps-setup'
    needs: build-test-and-scan
    uses: ./.github/workflows/update-gitops-image.yml
    with:
      image_name: erp-mcp-server
      image_tag: ${{ github.sha }}
    secrets:
      gitops_token: ${{ secrets.GITOPS_TOKEN }}
