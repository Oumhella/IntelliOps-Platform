name: Store Integration Service CI (DevSecOps)

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
    paths:
      - 'store-integration-service/**'
      - 'common_lib/**'
      - 'Dockerfile.microservice'
      - '.github/actions/build-and-scan-service/**'
      - '.github/workflows/update-gitops-image.yml'
      - '.github/workflows/store-integration-service-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'store-integration-service/**'
      - 'common_lib/**'
      - 'Dockerfile.microservice'
      - '.github/actions/build-and-scan-service/**'
      - '.github/workflows/update-gitops-image.yml'
      - '.github/workflows/store-integration-service-ci.yml'

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, test, and scan store-integration-service
        uses: ./.github/actions/build-and-scan-service
        with:
          service_name: store-integration-service
          service_port: 8090
          image_name: erp-store-integration-service
          run_tests: 'true'
          push_image: ${{ github.event_name == 'push' }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  update-gitops:
    name: Promote store-integration-service image to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/GitOps-setup'
    needs: build-and-scan
    uses: ./.github/workflows/update-gitops-image.yml
    with:
      image_name: erp-store-integration-service
      image_tag: ${{ github.sha }}
    secrets:
      gitops_token: ${{ secrets.GITOPS_TOKEN }}
