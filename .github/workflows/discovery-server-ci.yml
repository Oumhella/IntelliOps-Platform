name: Discovery Server CI (DevSecOps)

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - 'discovery-server/**'
      - 'Dockerfile.microservice'
      - '.github/actions/build-and-scan-service/**'
      - '.github/workflows/update-gitops-image.yml'
      - '.github/workflows/discovery-server-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'discovery-server/**'
      - 'Dockerfile.microservice'
      - '.github/actions/build-and-scan-service/**'
      - '.github/workflows/update-gitops-image.yml'
      - '.github/workflows/discovery-server-ci.yml'

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, scan & package discovery-server
        uses: ./.github/actions/build-and-scan-service
        with:
          service_name: discovery-server
          service_port: 8761
          image_name: erp-discovery-server
          build_common_lib: 'false'
          push_image: ${{ github.event_name == 'push' }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  update-gitops:
    name: Promote discovery-server image to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/GitOps-setup'
    needs: build-and-scan
    uses: ./.github/workflows/update-gitops-image.yml
    with:
      image_name: erp-discovery-server
      image_tag: ${{ github.sha }}
    secrets:
      gitops_token: ${{ secrets.GITOPS_TOKEN }}
