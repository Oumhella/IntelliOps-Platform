name: 'Build & Scan Microservice (DevSecOps)'
description: 'Builds target microservice (Java or Node), scans code and Docker image with Trivy'

inputs:
  project_type:
    description: 'Type de projet : java ou node'
    required: false
    default: 'java'
  service_name:
    description: 'Nom du dossier/module du microservice'
    required: true
  service_port:
    description: 'Port exposé par le microservice'
    required: false
    default: '8080'
  image_name:
    description: 'Nom de l''image Docker à produire'
    required: true
  java_version:
    description: 'Version du JDK'
    required: false
    default: '17'
  run_tests:
    description: 'Run unit tests'
    required: false
    default: 'false'
  build_common_lib:
    description: 'Build and install common_lib before building a Java service'
    required: false
    default: 'true'
  dockerfile:
    description: 'Dockerfile path for Java services; defaults to the shared Dockerfile'
    required: false
    default: 'Dockerfile.microservice'
  push_image:
    description: 'Push the image to Docker Hub after successful scans'
    required: false
    default: 'false'
  fail_on_vulnerabilities:
    description: 'Fail Trivy scans when vulnerabilities are found'
    required: false
    default: 'false'
  # --- DOCKER HUB INPUTS ---
  dockerhub_username:
    description: 'Nom d''utilisateur Docker Hub'
    required: false
    default: ''
  dockerhub_token:
    description: 'Token ou mot de passe Docker Hub'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    # -------------------------------------------------------------
    # JAVA / MAVEN STEPS
    # -------------------------------------------------------------
    - name: Configuration de Java ${{ inputs.java_version }}
      if: inputs.project_type == 'java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java_version }}
        cache: 'maven'

    - name: Build & install common_lib
      if: inputs.project_type == 'java' && inputs.build_common_lib == 'true'
      shell: bash
      run: |
        if [ -d "common_lib" ]; then
          cd common_lib
          mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=5 clean install -DskipTests
        fi

    - name: Resolve Maven Dependencies (${{ inputs.service_name }})
      if: inputs.project_type == 'java'
      shell: bash
      run: |
        cd ${{ inputs.service_name }}
        mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=5 dependency:resolve

    - name: Build and test with Maven (${{ inputs.service_name }})
      if: inputs.project_type == 'java'
      shell: bash
      run: |
        cd ${{ inputs.service_name }}
        if [ "${{ inputs.run_tests }}" = "true" ]; then
          mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=5 clean verify
        else
          mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=5 clean package -DskipTests
        fi

    # -------------------------------------------------------------
    # NODE / ANGULAR STEPS
    # -------------------------------------------------------------
    - name: Configuration de Node.js
      if: inputs.project_type == 'node'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '${{ inputs.service_name }}/package-lock.json'

    - name: Install NPM Dependencies (${{ inputs.service_name }})
      if: inputs.project_type == 'node'
      shell: bash
      run: |
        cd ${{ inputs.service_name }}
        npm ci

    - name: Run Node tests (${{ inputs.service_name }})
      if: inputs.project_type == 'node' && inputs.run_tests == 'true'
      shell: bash
      run: |
        cd ${{ inputs.service_name }}
        export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
        if [ -z "$CHROME_BIN" ]; then
          echo "No Chrome or Chromium executable was found on the CI runner."
          exit 1
        fi
        npm run test:ci

    # -------------------------------------------------------------
    # SHARED DEVSECOPS STEPS
    # -------------------------------------------------------------
    - name: Scan des vulnérabilités du code (Trivy FS)
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: './${{ inputs.service_name }}'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: ${{ inputs.fail_on_vulnerabilities == 'true' && '1' || '0' }}
        ignore-unfixed: true

    - name: Build de l'image Docker (${{ inputs.image_name }})
      shell: bash
      run: |
        # If project is Node/Angular, build using local Dockerfile
        if [ "${{ inputs.project_type }}" = "node" ]; then
          cd ${{ inputs.service_name }}
          docker build -t ${{ inputs.image_name }}:latest .
        elif [ "${{ inputs.dockerfile }}" = "Dockerfile.microservice" ]; then
          # Standard Java services use the shared Dockerfile from the repo root.
          docker build \
            -f Dockerfile.microservice \
            --build-arg SERVICE_NAME=${{ inputs.service_name }} \
            --build-arg SERVICE_PORT=${{ inputs.service_port }} \
            --build-arg BUILD_COMMON_LIB=${{ inputs.build_common_lib }} \
            -t ${{ inputs.image_name }}:latest .
        else
          # Infrastructure services may need a service-specific entrypoint.
          docker build \
            -f "${{ inputs.dockerfile }}" \
            -t ${{ inputs.image_name }}:latest .
        fi

    - name: Scan de l'image Docker (Trivy Image)
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: '${{ inputs.image_name }}:latest'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: ${{ inputs.fail_on_vulnerabilities == 'true' && '1' || '0' }}
        ignore-unfixed: true

    - name: Scan for hardcoded secrets (Gitleaks)
      shell: bash
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/repo" \
          ghcr.io/gitleaks/gitleaks:v8.30.1 \
          git --redact --no-banner --verbose /repo

    # -------------------------------------------------------------
    # 7. DOCKER HUB LOGIN & PUSH (Immutable Git SHA tagging)
    # -------------------------------------------------------------
    - name: Connexion à Docker Hub
      if: inputs.push_image == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Push vers Docker Hub (Git SHA Tag Only)
      if: inputs.push_image == 'true'
      shell: bash
      run: |
        FULL_IMAGE_NAME="${{ inputs.dockerhub_username }}/${{ inputs.image_name }}"
        IMAGE_TAG="${{ github.sha }}"

        # Use the complete commit SHA: it is immutable and avoids short-SHA collisions.
        docker tag "${{ inputs.image_name }}:latest" "$FULL_IMAGE_NAME:$IMAGE_TAG"

        # Push unique image tag to Docker Hub
        docker push "$FULL_IMAGE_NAME:$IMAGE_TAG"

        echo "Pushed immutable image: $FULL_IMAGE_NAME:$IMAGE_TAG"
